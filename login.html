<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400;1,700&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/media.css" />
</head>
<body class="product-list">

   
    <div class="cursor-bubbles"></div>

    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>

    <main>

        <section class="login-sec">
            <div class="form-main-bx">
                <div class="form-heading">Havmor Media</div>

                <div class="right-form">
                    <div class="login-form-container container-width">
                        <div class="heading-bx">
                            <small>ACCOUNT LOGIN</small>
                            <h2>Welcome back.</h2>
                            <p>Sign in to access your performance dashboard.</p>
                        </div>

                        <form action="#" id="login-form">

                            <!-- Email -->
                            <div class="login-form-input">
                                <label for="log-email">Email address</label>
                                <div class="login-input">
                                    <span class="input-icon mail-icon"><i class="ri-mail-line input-icon"></i></span>
                                    <input type="email" placeholder="you@gmail.com" id="log-email" onkeyup="loginValidateEmail()" />
                                </div>
                                <p id="err-email"></p>
                            </div>

                            <!-- Password -->

                            <div class="login-form-input">

                                <div class="pass-bx">
                                    <label for="log-pass"> Password </label>
                                    <!-- <a href="#" class="forget-link">Forget Password?</a> -->
                                </div>
                                
                                <div class="login-input">
                                    <span class="input-icon lock-icon"><i class="ri-lock-line input-icon"></i></span>
                                    <input type="password" placeholder="Password" class="input-pss-field" id="log-pass" onkeyup="logPasswordValidate()" />

                                    <div class="eye-icon-bx">
                                        <span class="close-eye-icon"> <i class="ri-eye-line"></i>
                                        </span>
                                        <span class="open-eye-icon"> <i class="ri-eye-off-line"></i>
                                        </span>

                                    </div>
                                    
                                </div>
                                <p id="err-pass"></p>
                            </div>

                            <button type="submit" class="sign-in-btn">Sign in <span> <i class="ri-arrow-right-line"></i> </span> </button>

                            <p class="create-acc">Don't have an account? <a href="signup.html" class="create-acc-link"> Create an account </a> </p>
                        </form>
                    </div>
                </div>

            </div>
        </section>

    </main>


    
    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

    <!-- ScrollTrigger -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

    <script src="js/script.js"></script>
</body>
</html>
