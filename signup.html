<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Create Account | Havmor Media</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- Remix Icon -->
    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
        rel="stylesheet">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400;1,700&family=Oswald:wght@200..700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Responsive CSS -->
    <link rel="stylesheet" href="css/media.css">

</head>


<body class="product-list">

    
    <!-- ================================
        CUSTOM CURSOR
    ================================= -->

    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>

    <main>

        <!-- ================================
            SIGNUP SECTION
        ================================= -->

        <section class="login-sec signup-sec">

            <div>

                <div class="right-form">


                    <div class="login-form-container signup-form-container container-width">


                        <!-- Heading -->

                        <div class="heading-bx">

                            <small>
                                CREATE ACCOUNT
                            </small>

                            <h2>
                                Start growing.
                            </h2>

                            <p>
                                Create your account to access
                                your performance dashboard.
                            </p>

                        </div>


                        <!-- Signup Form -->

                        <form action="#" id="form" novalidate>


                            <!-- First Name -->

                            <div class="login-form-input">

                                <label for="name-input"> Name </label>

                                <div class="login-input">
                                    <span class="input-icon">
                                        <i class="ri-user-line"></i>
                                    </span>
                                    <input type="text" id="name-input" placeholder="John Doe" onkeyup="validateName()">
                                </div>
                                <p id="err-name"></p>

                            </div>


                            <!-- Email -->

                            <div class="login-form-input">

                                <label for="email-input"> Email address </label>

                                <div class="login-input">

                                    <span class="input-icon">
                                        <i class="ri-mail-line"></i>
                                    </span>

                                    <input type="email" id="email-input" placeholder="you@company.com" onkeyup="validateSignupEmail()" />

                                </div>
                                <p id="err-email"></p>

                            </div>

                            <!-- Mobile -->

                            <div class="login-form-input">

                                <label for="mobile-input"> Mobile no. </label>

                                <div class="login-input">

                                    <span class="input-icon">
                                        <i class="ri-phone-line"></i>
                                    </span>

                                    <input type="tel" id="mobile-input" placeholder="Enter your mobile no." onkeyup="validateMobile()" maxlength="10"  />

                                </div>
                                <p id="err-mobile"></p>

                            </div>



                            <!-- Password -->

                            <div class="login-form-input">
                                <div class="pass-bx">
                                    <label for="log-pass"> Password </label>
                                </div>
                                
                                <div class="login-input">
                                    <span class="input-icon lock-icon"><i class="ri-lock-line input-icon"></i></span>
                                    <input type="password" placeholder="Password" class="input-pss-field" id="signup-pass" onkeyup="validateSignupPassword()" />

                                    <div class="eye-icon-bx">
                                        <span class="close-eye-icon"> <i class="ri-eye-line"></i>
                                        </span>
                                        <span class="open-eye-icon"> <i class="ri-eye-off-line"></i>
                                        </span>
                                    </div>
                                    
                                </div>
                                <p id="err-pass"></p>
                            </div>


                            <!-- Repeat Password -->

                            <!-- <div class="login-form-input">

                                <label for="repeat-password-input">
                                    Confirm password
                                </label>


                                <div class="login-input">

                                    <span class="input-icon">

                                        <i class="ri-shield-check-line"></i>

                                    </span>


                                    <input type="password" id="repeat-password-input" placeholder="Confirm your password">

                                </div>

                            </div> -->


                            <!-- Terms -->

                            <div class="signup-terms mb-3">

                                <label> <input type="checkbox" id="terms-checkbox"> <span>

                                        I agree to the
                                        <a href="#">
                                            Terms of Service
                                        </a>
                                        and
                                        <a href="#">
                                            Privacy Policy
                                        </a>
                                    </span>

                                </label>

                            </div>


                            <!-- Submit -->

                            <button type="submit" class="sign-in-btn signup-btn">
                                
                                Create account
                                <span>
                                    <i class="ri-arrow-right-line"></i>
                                </span>
                            </button>


                            <!-- Login -->

                            <p class="create-acc">

                                Already have an account?

                                <a
                                    href="login.html"
                                    class="create-acc-link">

                                    Sign in

                                </a>

                            </p>


                        </form>


                    </div>


                </div>


            </div>

        </section>
    
    </main>    

    <!-- GSAP -->

    <script
        src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js">
    </script>


    <!-- ScrollTrigger -->

    <script
        src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js">
    </script>


    <!-- Main JS -->

    <script src="js/script.js"></script>


</body>

</html>
